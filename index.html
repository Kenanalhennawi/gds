<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDS Decoder | Enterprise Intelligence</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-background"></div>
    <div class="app-overlay"></div>

    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <div class="logo-icon">GDS</div>
                <div class="logo-text">
                    <h1>Decoder</h1>
                    <span>Enterprise Edition</span>
                </div>
            </div>
            <div class="actions">
                <button id="btnClear" class="btn-glass">Clear Console</button>
            </div>
        </header>

        <main class="workspace">
            <section class="input-section">
                <div class="glass-panel">
                    <textarea id="gdsInput" placeholder="Paste raw GDS history, PNR logs, or EDIFACT messages here..."></textarea>
                    <div class="input-status" id="inputStatus">Ready for input</div>
                </div>
            </section>

            <section class="output-section">
                <div id="timeline" class="timeline-container">
                    <div class="empty-state">
                        <div class="empty-icon">waiting</div>
                        <h3>Awaiting Data Stream</h3>
                        <p>System ready to parse AIRIMP, EDIFACT, and GDS history logs.</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
