<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GDS History Reader</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand__logo">GDS</div>
      <div class="brand__meta">
        <div class="brand__title">History Reader</div>
        <div class="brand__sub">QP/QK/QD · HDQRM · SSR/OSI · Seats Not Available</div>
      </div>
    </div>
    <div class="topbar__actions">
      <button id="btnTheme" class="btn btn--ghost" type="button">Theme</button>
      <button id="btnParse" class="btn" type="button">Parse</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel">
      <div class="panel__head">
        <div class="panel__title">Input</div>
        <div class="panel__hint">Paste raw logs (with or without control characters)</div>
      </div>
      <textarea id="input" class="input" spellcheck="false"></textarea>

      <div class="split">
        <div class="panel__head panel__head--inline">
          <div class="panel__title">Search Knowledge Base</div>
          <div class="panel__hint">Search codes (HK, UC, SSR DOCS, ADTK, TRL, etc.)</div>
        </div>
        <div class="searchRow">
          <input id="search" class="search" placeholder="Search…" />
          <button id="btnClear" class="btn btn--ghost" type="button">Clear</button>
        </div>
      </div>
      <div id="searchResults" class="searchResults"></div>
    </section>

    <section class="panel">
      <div class="panel__head">
        <div class="panel__title">Parsed Output</div>
        <div id="summary" class="panel__hint"></div>
      </div>
      <div id="output" class="output"></div>
    </section>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
